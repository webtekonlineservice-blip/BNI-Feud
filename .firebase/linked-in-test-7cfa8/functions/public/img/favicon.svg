<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8533;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6a00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Game board style accent stripe -->
  <rect x="2" y="15" width="96" height="12" fill="url(#orangeGrad)" opacity="0.95"/>
  
  <!-- BNI text - clean and bold -->
  <text x="50" y="65" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="42" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-1">BNI</text>
  
  <!-- Subtitle "Feud" -->
  <text x="50" y="85" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        font-weight="700" 
        fill="#ff8533" 
        text-anchor="middle"
        letter-spacing="1">FEUD</text>
  
  <!-- Decorative stars -->
  <circle cx="15" cy="21" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="85" cy="21" r="2.5" fill="white" opacity="0.9"/>
</svg>
